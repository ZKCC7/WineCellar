<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ma Cave à Vin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/localbase/dist/localbase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/grappe96.png" type="image/png">
  <meta name="theme-color" content="#8b0000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <button id="menuBtn">☰</button>
  <h1>Ma Cave à Vin</h1>
  <button id="headerAddBtn" onclick="switchView('view-add')">＋</button>
</header>

<div id="menuOverlay" style="display:none;"></div>

<nav id="sideMenu">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">
    <h2 style="margin:0; font-size:1.25rem;">Options</h2>
    <button id="themeToggleBtn" style="background:none; border:none; font-size:1.3rem; cursor:pointer;">🌓</button>
  </div>
  <div class="settings-box" style="margin-bottom:15px; padding:12px; border-radius:8px;">
    <h4 style="margin:0 0 8px 0; color:#60a5fa;">🔑 Clé API Gemini</h4>
    <input type="password" id="aiApiKey" placeholder="Clé API..." style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border-color); background:var(--background-app); color:var(--text-primary);">
    <button id="btnSaveAiKey" class="btn" style="width:100%; margin-top:8px;">Enregistrer</button>
  </div>
</nav>

<main style="padding-bottom:80px;">

  <!-- Vue Liste -->
  <section id="view-list" class="screen visible">
    <div style="padding:15px;">
      <h2>Ma Cave</h2>
      <div id="wineList"></div>
    </div>
  </section>

  <!-- Vue Inventaire -->
  <section id="view-inventory" class="screen">
    <div style="padding:15px;">
      <h2>Inventaire</h2>
      <div id="inventoryContent"></div>
    </div>
  </section>

  <!-- Vue Alertes -->
  <section id="view-alerts" class="screen">
    <div style="padding:15px;">
      <h2>Alertes</h2>
      <div id="alertsContent"></div>
    </div>
  </section>

  <!-- Vue Achats -->
  <section id="view-shop" class="screen">
    <div style="padding:15px;">
      <h2>Achats</h2>
      <div id="shopContent"></div>
    </div>
  </section>

  <!-- Vue Scanner -->
  <section id="view-scan" class="screen">
    <div style="padding:15px; text-align:center;">
      <h2>Scanner</h2>
      <label for="scanInput" class="btn">📸 Scanner une étiquette</label>
      <input type="file" id="scanInput" accept="image/*" capture="environment" style="display:none;">
      <div id="scanResult" style="margin-top:20px;"></div>
    </div>
  </section>

  <!-- Vue Stats -->
  <section id="view-stats" class="screen">
    <div style="padding:15px;">
      <h2>Statistiques</h2>
      <div id="statsContent"></div>
    </div>
  </section>

  <!-- Vue Ajouter -->
  <section id="view-add" class="screen">
    <div style="padding:15px;">
      <h2>Ajouter une bouteille</h2>
      <form id="wineForm">
        <input type="text" id="wineCuvee" placeholder="Cuvée" required>
        <input type="text" id="wineDomain" placeholder="Domaine">
        <button type="button" id="btnAiFill" onclick="assistantRemplirFormulaire()">Remplir par IA</button>
        <button type="submit">Enregistrer</button>
      </form>
    </div>
  </section>
</main>

<nav id="bottomNav">
  <button class="navItem active" data-screen="view-list">📦 Ma cave</button>
  <button class="navItem" data-screen="view-inventory">🍾 Inventaire</button>
  <button class="navItem" data-screen="view-alerts">🔔 Alertes</button>
  <button class="navItem" data-screen="view-shop">🛒 Achats</button>
  <button class="navItem" data-screen="view-scan">📷 Scanner</button>
  <button class="navItem" data-screen="view-stats">📊 Stats</button>
</nav>

<!-- Scripts -->
<script src="db.js"></script>
<script src="ui.js"></script>
<script src="scan.js"></script>
<script src="ai.js"></script>
<script src="stats.js"></script>
<script src="alerts.js"></script>
<script src="shop.js"></script>
<script src="app.js"></script>
</body>
</html>
